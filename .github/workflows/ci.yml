name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate core and web
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            core/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Install core dependencies
        working-directory: core
        run: pnpm install --frozen-lockfile

      - name: Check core types
        working-directory: core
        run: pnpm typecheck

      - name: Test core
        working-directory: core
        run: pnpm test

      - name: Build core
        working-directory: core
        run: pnpm build

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Check web types
        working-directory: web
        run: pnpm typecheck

      - name: Build web
        working-directory: web
        run: pnpm build
